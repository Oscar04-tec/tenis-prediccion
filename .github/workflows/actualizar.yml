name: Actualizar ratings

on:
  schedule:
    - cron: "17 9 * * *"     # 03:17 Tampico — histórico + Elo + slate
    - cron: "47 19 * * *"    # 13:47 Tampico — solo slate (cuotas frescas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # El secreto se expone como variable de entorno del job.
    # No se puede consultar 'secrets' directamente en un 'if' de paso.
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # Verdadero solo en la corrida de la madrugada y en las manuales.
      RECONSTRUIR: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * *' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El histórico solo se reconstruye en la corrida de la madrugada.
      - name: Descargar resultados y calcular Elo
        if: env.RECONSTRUIR == 'true'
        run: |
          python ingesta.py --wta
          python exportar.py

      - name: Verificar frescura
        if: env.RECONSTRUIR == 'true'
        run: |
          ATRASO=$(python -c "from ingesta import frescura; print(frescura())")
          echo "Atraso de datos: $ATRASO dias"
          if [ "$ATRASO" -gt 10 ]; then
            echo "::warning::La fuente lleva $ATRASO dias sin actualizarse."
          fi

      - name: Generar slate del dia
        if: env.ODDS_API_KEY != ''
        run: python slate.py

      - name: Avisar si falta la llave
        if: env.ODDS_API_KEY == ''
        run: echo "::warning::Sin ODDS_API_KEY. No se genero el slate."

      - name: Publicar cambios
        run: |
          git config user.name  "ratings-bot"
          git config user.email "actions@github.com"
          git add publico/
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
