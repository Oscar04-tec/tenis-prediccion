name: Actualizar ratings

on:
  schedule:
    - cron: "0 9 * * *"     # 03:00 Tampico — ratings + slate
    - cron: "0 21 * * *"    # 15:00 Tampico — solo slate (cuotas frescas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El histórico solo se reconstruye en la corrida de la madrugada.
      - name: Descargar resultados y calcular Elo
        if: github.event.schedule != '0 21 * * *'
        run: |
          python ingesta.py
          python exportar.py

      - name: Verificar frescura
        if: github.event.schedule != '0 21 * * *'
        run: |
          ATRASO=$(python -c "from ingesta import frescura; print(frescura())")
          echo "Atraso de datos: $ATRASO días"
          if [ "$ATRASO" -gt 10 ]; then
            echo "::warning::La fuente lleva $ATRASO días sin actualizarse."
          fi

      - name: Generar slate del día
        if: ${{ secrets.ODDS_API_KEY != '' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python slate.py

      - name: Publicar cambios
        run: |
          git config user.name  "ratings-bot"
          git config user.email "actions@github.com"
          git add publico/
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
